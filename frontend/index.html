<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow-a-Garden Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Grow-a-Garden Pro</h1>
<div class="tagline">plant · water · weather · harvest · sell</div>
<div class="hud">
  <span>🪙 <b id="coins">0</b></span>
  <span>⭐ Lv <b id="level">1</b> (<span id="xp">0</span>/<span id="xpNeed">10</span> XP)</span>
  <span id="weather">☀️</span>
  <span>🧺 <b id="basket">0</b></span>
</div>
<div id="garden"></div>
<div class="weather-banner" id="wBanner"></div>
<div id="toolbar">
  <button class="tool" data-tool="hoe">⛏️ Hoe</button>
  <button class="tool" data-tool="seed">🌱 Seed</button>
  <button class="tool" data-tool="water">💧 Water</button>
  <button class="tool active" data-tool="hand">✋ Harvest</button>
</div>
<div id="seedMenu"></div>
<div id="log">Pick seed tool, then a crop.</div>
<button class="sell" id="sellBtn" disabled>Sell basket</button>
<button id="resetBtn">reset save</button>
<script src="js/data.js"></script>
<script src="js/sfx.js"></script>
<script src="js/api.js"></script>
<script src="js/game.js"></script>
</body>
</html>
