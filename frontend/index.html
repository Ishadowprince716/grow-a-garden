<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow-a-Garden Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 3D farm backdrop -->
<div id="c3dHost" aria-hidden="true"></div>

<!-- Top bar -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🌱</span>
    <div class="brand-txt">
      <h1>Grow-a-Garden</h1>
      <span class="tagline">plant · water · weather · harvest · sell</span>
    </div>
  </div>
  <div class="hud">
    <div class="stat" title="Coins"><span class="ico">🪙</span><b id="coins">0</b></div>
    <div class="stat" title="Level & XP"><span class="ico">⭐</span>
      <div class="lv"><b id="level">1</b><span class="xp"><span id="xp">0</span>/<span id="xpNeed">10</span></span></div>
    </div>
    <div class="stat" title="Weather"><span class="ico" id="weather">☀️</span></div>
    <div class="stat" title="Season"><span class="ico">🍃</span><b id="season">summer</b></div>
    <div class="stat" title="Harvest basket"><span class="ico">🧺</span><b id="basket">0</b></div>
    <div class="stat actions">
      <button id="sellBtn" class="sell" disabled><span>💰</span> Sell</button>
    </div>
  </div>
</header>

<!-- Weather banner toast -->
<div class="weather-banner" id="wBanner" role="status"></div>

<!-- Tool dock -->
<nav class="dock" aria-label="tools">
  <button class="tool" data-tool="hoe" title="Clear a plot">⛏️<span>Hoe</span></button>
  <button class="tool" data-tool="seed" title="Plant a seed">🌱<span>Seed</span></button>
  <button class="tool" data-tool="water" title="Water a crop">💧<span>Water</span></button>
  <button class="tool" data-tool="hand" title="Harvest ripe crops">✋<span>Harvest</span></button>
  <button class="tool" data-tool="decor" title="Place decor">🎨<span>Decor</span></button>
</nav>

<!-- Dynamic pickers -->
<div id="seedMenu" class="menu" aria-label="crops"></div>
<div id="decorMenu" class="menu" aria-label="decor"></div>

<!-- Toast log -->
<div id="log" role="status" aria-live="polite"></div>

<div class="foot-util">
  <button id="muteBtn" title="Toggle sound">🔊</button>
  <button id="resetBtn" title="Erase save and start over">reset save</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sfx.js"></script>
<script src="js/api.js"></script>
<script src="js/metrics.js"></script>
<script src="js/world3d.js"></script>
<script src="js/game.js"></script>
</body>
</html>
